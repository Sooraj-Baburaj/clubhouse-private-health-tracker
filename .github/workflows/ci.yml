name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit, integration, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clubhouse
          POSTGRES_PASSWORD: clubhouse
          POSTGRES_DB: clubhouse
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clubhouse" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://clubhouse:clubhouse@localhost:5432/clubhouse
      TEST_DATABASE_URL: postgres://clubhouse:clubhouse@localhost:5432/clubhouse_test
      SESSION_PEPPER: ci-session-pepper-0123456789abcdef
      TOTP_ENC_KEY: ci-totp-key-0123456789abcdef0123
      CRON_SECRET: ci-cron-secret-0123456789abcdef
      AI_MODE: mock
      STORAGE_DRIVER: local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit tests (domain, AI gateway guards, copy lint)
        run: pnpm test
      - name: Integration tests (Postgres)
        run: pnpm test:integration
      - name: Build (Vercel output)
        run: pnpm build:vercel
      - name: Function size budget
        run: |
          size=$(du -sm .vercel/output/functions/api.func | cut -f1)
          echo "api.func: ${size} MB"
          test "$size" -lt 200

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clubhouse
          POSTGRES_PASSWORD: clubhouse
          POSTGRES_DB: clubhouse
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clubhouse" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://clubhouse:clubhouse@localhost:5432/clubhouse
      SESSION_PEPPER: ci-session-pepper-0123456789abcdef
      TOTP_ENC_KEY: ci-totp-key-0123456789abcdef0123
      CRON_SECRET: ci-cron-secret-0123456789abcdef
      SETUP_TOKEN: ci-setup-token
      AI_MODE: mock
      STORAGE_DRIVER: local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate && pnpm seed:all && pnpm seed:demo
      - run: pnpm --filter @clubhouse/e2e exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
