name: Migrate database

# Migrations run from here, never inside the Vercel build (plan §11). Uses the Supabase *session* pooler (port 5432).
on:
  push:
    branches: [main]
    # A new branch is diffed against the default branch, so pushing a branch that already matches it changes no paths;
    # run the workflow by hand (workflow_dispatch) in that case. Editing this file also triggers a run.
    paths: ['packages/db/drizzle/**', 'packages/db/src/schema.ts', '.github/workflows/migrate.yml']
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails clearly when the secret is missing (an unset secret is an empty string) and shows only host:port, never
      # the password, so a mis-encoded URL is easy to spot.
      - name: Check database URL
        env:
          DATABASE_URL_MIGRATE: ${{ secrets.DATABASE_URL_MIGRATE }}
        run: |
          if [ -z "$DATABASE_URL_MIGRATE" ]; then
            echo "::error::DATABASE_URL_MIGRATE is empty. Add it as a secret (not a variable) of the 'production' environment."
            exit 1
          fi
          node -e 'let u; try { u = new URL(process.env.DATABASE_URL_MIGRATE); } catch {} if (!u?.hostname) { console.log("::error::DATABASE_URL_MIGRATE is not a valid URL. Percent-encode special characters (@ # / ?) in the password."); process.exit(1); } console.log(`Migrating ${u.hostname}:${u.port || 5432}`)'
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATE }}
          DATABASE_URL_MIGRATE: ${{ secrets.DATABASE_URL_MIGRATE }}
        run: pnpm db:migrate
      - name: Static seeds (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATE }}
          DATABASE_URL_MIGRATE: ${{ secrets.DATABASE_URL_MIGRATE }}
        run: pnpm seed:static
