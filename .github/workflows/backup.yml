name: Nightly backup

# Supabase Free has no automated backups: dump nightly, encrypt with age, keep 90 days as an artifact (plan §17).
on:
  schedule:
    - cron: '30 21 * * *' # 03:00 IST
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Install pg_dump 17 and age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -yq postgresql-client-17 age
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATE }}
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL" | age -r "$AGE_RECIPIENT" > "clubhouse-${stamp}.dump.age"
          ls -lh clubhouse-*.dump.age
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: clubhouse-db-${{ env.STAMP }}
          path: clubhouse-*.dump.age
          retention-days: 90
